<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; form-action https:; base-uri 'none'">
<meta name="referrer" content="strict-origin">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d2a2f">
<title>Kısayollar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kısayollar">
<style>
:root{
  --deniz:#0d2a2f;--yuzey:#143a40;--yuzey2:#1b4a51;--cizgi:#2a5c63;
  --yazi:#eef4ef;--soluk:#a4bfbd;--pirinc:#e6b450;--pirinc-koyu:#3a2c0a;--kirmizi:#ff9c8a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--deniz);color:var(--yazi);font:16px/1.45 "Segoe UI Variable","Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--pirinc);outline-offset:2px}
[hidden]{display:none!important}
.ekran{width:100%;max-width:560px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 32px}

/* PIN */
#pinEkran{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
#pinBaslik{font-size:1.5rem;font-weight:600;margin:0 0 6px;text-align:center}
#pinAlt{color:var(--soluk);margin:0 0 26px;text-align:center;min-height:1.45em;max-width:34ch}
#pinAlt.hata{color:var(--kirmizi)}
#noktalar{display:flex;gap:14px;margin-bottom:30px}
#noktalar i{width:16px;height:16px;border-radius:50%;border:2px solid var(--cizgi);transition:background .1s,border-color .1s}
#noktalar i.dolu{background:var(--pirinc);border-color:var(--pirinc)}
#tus{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
#tus button{height:76px;border-radius:50%;background:var(--yuzey);font-size:1.6rem;font-weight:500}
#tus button:hover{background:var(--yuzey2)}
#tus button:active{background:var(--cizgi)}
#tus .bos{visibility:hidden}
#tus .sil{background:none;font-size:1rem;color:var(--soluk)}
#unuttum{margin-top:26px;color:var(--soluk);font-size:.9rem;text-decoration:underline;padding:8px}
#unuttum.emin{color:var(--kirmizi)}
#pinVazgec{margin-top:26px;color:var(--soluk);font-size:.9rem;text-decoration:underline;padding:8px}

/* Ana ekran */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:1.65rem;font-weight:650;margin:0}
.kucuk{padding:9px 14px;border-radius:9px;color:var(--soluk);background:var(--yuzey)}
.kucuk:hover{color:var(--yazi);background:var(--yuzey2)}
#liste{display:flex;flex-direction:column;gap:10px}
.satir{display:flex;align-items:stretch;background:var(--yuzey);border-radius:14px;overflow:hidden}
.satir:hover{background:var(--yuzey2)}
.ac{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:14px;text-align:left}
.etiket{flex:none;width:52px;height:52px;border-radius:13px 13px 13px 26px;background:var(--pirinc);color:var(--pirinc-koyu);display:grid;place-items:center;font-size:1.45rem;font-weight:750}
.satir.eksik .etiket{background:var(--cizgi);color:var(--soluk)}
.bilgi{min-width:0}
.ad{display:block;font-size:1.1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alan{display:block;color:var(--soluk);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.satir.eksik .alan{color:var(--pirinc)}
.duzenle{flex:none;padding:0 16px;color:var(--soluk);font-size:.88rem;border-left:1px solid var(--cizgi)}
.duzenle:hover{color:var(--yazi)}
#bosMesaj{color:var(--soluk);padding:18px 2px}
#ekle{width:100%;margin-top:12px;padding:15px;border:1.5px dashed var(--cizgi);border-radius:14px;color:var(--soluk)}
#ekle:hover{color:var(--yazi);border-color:var(--soluk)}
#altMenu{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:30px}
#altMenu button{padding:6px 0;color:var(--soluk);font-size:.9rem;text-decoration:underline}
#altMenu button.emin{color:var(--kirmizi)}

/* Düzenleme */
dialog{width:min(480px,calc(100vw - 24px));border:0;border-radius:16px;padding:22px;background:var(--yuzey);color:var(--yazi)}
dialog::backdrop{background:rgba(4,16,18,.72)}
dialog h2{margin:0 0 16px;font-size:1.25rem;font-weight:650}
label{display:block;margin-bottom:14px;font-size:.9rem;color:var(--soluk)}
label input{display:block;width:100%;margin-top:5px;padding:12px;border-radius:9px;border:1px solid var(--cizgi);background:var(--deniz);font-size:1rem;color:var(--yazi)}
.sifreKutu{position:relative}
.sifreKutu input{padding-right:78px}
#goster{position:absolute;right:6px;bottom:6px;padding:7px 10px;color:var(--soluk);font-size:.85rem}
#hata{color:var(--kirmizi);font-size:.9rem;margin:0 0 12px}
.dugmeler{display:flex;gap:10px;align-items:center;margin-top:6px}
#kaydet{padding:12px 22px;border-radius:10px;background:var(--pirinc);color:var(--pirinc-koyu);font-weight:650}
#vazgec{padding:12px 16px;border-radius:10px;background:var(--yuzey2)}
#sil{margin-left:auto;padding:12px 4px;color:var(--soluk);font-size:.9rem}
#sil.emin{color:var(--kirmizi);font-weight:600}
#bildirim{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--pirinc);color:var(--pirinc-koyu);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100vw - 32px)}
@media (max-width:360px){#tus{grid-template-columns:repeat(3,66px)}#tus button{height:66px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="pinEkran" hidden>
  <h2 id="pinBaslik"></h2>
  <p id="pinAlt" aria-live="polite"></p>
  <div id="noktalar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="tus"></div>
  <button id="unuttum" type="button" hidden>PIN'i unuttum</button>
  <button id="pinVazgec" type="button" hidden>Vazgeç</button>
</section>

<main id="anaEkran" class="ekran" hidden>
  <header>
    <h1>Kısayollar</h1>
    <button id="kilitle" class="kucuk" type="button">Kilitle</button>
  </header>
  <div id="liste"></div>
  <p id="bosMesaj" hidden>Henüz site yok. Aşağıdan ilk siteni ekle.</p>
  <button id="ekle" type="button">Site ekle</button>
  <div id="altMenu">
    <button id="pinDegis" type="button">PIN'i değiştir</button>
    <button id="hepsiniSil" type="button">Bu cihazdaki kayıtları sil</button>
  </div>
</main>

<dialog id="pencere">
  <form id="form" method="dialog" autocomplete="off">
    <h2 id="pencereBaslik"></h2>
    <label>Görünecek ad
      <input id="fAd" maxlength="40" required autocomplete="off">
    </label>
    <label>Panel adresi
      <input id="fAdres" inputmode="url" placeholder="siteadi.com/admin" required autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <label>Kullanıcı adı
      <input id="fKullanici" required autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <label class="sifreKutu">Şifre
      <input id="fSifre" type="password" required autocomplete="new-password">
      <button id="goster" type="button">Göster</button>
    </label>
    <p id="hata" role="alert" hidden></p>
    <div class="dugmeler">
      <button id="kaydet" type="submit">Kaydet</button>
      <button id="vazgec" type="button">Vazgeç</button>
      <button id="sil" type="button" hidden>Siteyi sil</button>
    </div>
  </form>
</dialog>

<div id="bildirim" role="status" hidden></div>

<script>
'use strict';
const KASA='panel_kasa_v1', DENEME='panel_deneme_v1', TUR=600000, PIN_UZUNLUK=6, BOSTA_MS=15*60*1000;
const $=id=>document.getElementById(id);
const metin=new TextEncoder(), cozucu=new TextDecoder();
let anahtar=null, tuz=null, veri={kartlar:[]}, tohum=null, pin='', mod='', ilkPin='', mesgul=false, duzenlenen=null, bostaSayac=null;

function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function b64c(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function oku(k){try{return localStorage.getItem(k)}catch(e){return null}}
function yaz(k,v){localStorage.setItem(k,v)}
function kaldir(k){try{localStorage.removeItem(k)}catch(e){}}

async function anahtarUret(p,t){
  const ham=await crypto.subtle.importKey('raw',metin.encode(p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:t,iterations:TUR,hash:'SHA-256'},ham,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function kaydet(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const sifreli=await crypto.subtle.encrypt({name:'AES-GCM',iv},anahtar,metin.encode(JSON.stringify(veri)));
  yaz(KASA,JSON.stringify({t:b64(tuz),iv:b64(iv),v:b64(sifreli)}));
}
async function ac(p){
  const k=JSON.parse(oku(KASA));
  const t=b64c(k.t), a=await anahtarUret(p,t);
  const acik=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64c(k.iv)},a,b64c(k.v));
  veri=JSON.parse(cozucu.decode(acik)); anahtar=a; tuz=t;
}

/* Kurulum bağlantısı: site adları adresin # kısmında gelir, sunucuya gitmez */
function tohumOku(){
  const m=location.hash.match(/^#k=([\w-]+)/);
  if(!m) return;
  try{
    const s=atob(m[1].replace(/-/g,'+').replace(/_/g,'/'));
    const liste=JSON.parse(cozucu.decode(Uint8Array.from(s,c=>c.charCodeAt(0))));
    if(Array.isArray(liste)) tohum=liste.map(x=>({id:yeniId(),ad:String(x.n).slice(0,40),adres:adresDuzelt(x.u),kullanici:'',sifre:''}));
  }catch(e){tohum=null}
  history.replaceState(null,'',location.pathname+location.search);
}
function yeniId(){return b64(crypto.getRandomValues(new Uint8Array(9)))}
function adresDuzelt(v){
  v=String(v).trim();
  if(!/^[a-z]+:\/\//i.test(v)) v='https://'+v;
  const u=new URL(v);
  if(u.protocol!=='https:') throw new Error('Adres https ile başlamalı.');
  let yol=u.pathname.replace(/\/index\.php$/i,'').replace(/\/+$/,'');
  if(!yol) yol='/admin';
  return u.origin+yol;
}
function alanAdi(adres){try{return new URL(adres).hostname.replace(/^www\./,'')}catch(e){return adres}}

/* PIN ekranı */
function tusKur(){
  const t=$('tus');
  ['1','2','3','4','5','6','7','8','9','','0','Sil'].forEach(d=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=d;
    if(d==='') b.className='bos';
    else if(d==='Sil'){b.className='sil';b.onclick=()=>pinSil()}
    else b.onclick=()=>pinEkle(d);
    t.appendChild(b);
  });
}
function noktalar(){[...$('noktalar').children].forEach((n,i)=>n.classList.toggle('dolu',i<pin.length))}
function pinGoster(m,alt,hata){
  mod=m; pin=''; noktalar();
  const b={kur1:'PIN belirle',kur2:'PIN\'i tekrar gir',ac:'PIN\'ini gir',deg1:'Yeni PIN',deg2:'Yeni PIN\'i tekrar gir'}[m];
  $('pinBaslik').textContent=b;
  const a=$('pinAlt'); a.textContent=alt||''; a.classList.toggle('hata',!!hata);
  $('unuttum').hidden=m!=='ac'; $('unuttum').classList.remove('emin'); $('unuttum').textContent='PIN\'i unuttum';
  $('pinVazgec').hidden=!(m==='deg1'||m==='deg2');
  $('anaEkran').hidden=true; $('pinEkran').hidden=false;
}
function pinEkle(d){if(mesgul||pin.length>=PIN_UZUNLUK)return;pin+=d;noktalar();if(pin.length===PIN_UZUNLUK)setTimeout(pinBitti,90)}
function pinSil(){if(mesgul)return;pin=pin.slice(0,-1);noktalar()}
function denemeOku(){try{return JSON.parse(oku(DENEME))||{n:0,t:0}}catch(e){return{n:0,t:0}}}
async function pinBitti(){
  const p=pin, m=mod; mesgul=true;
  try{
    if(mod==='kur1'||mod==='deg1'){
      ilkPin=p; pinGoster(mod==='kur1'?'kur2':'deg2','Aynı 6 haneyi gir.');
    }else if(mod==='kur2'||mod==='deg2'){
      if(p!==ilkPin){pinGoster(mod==='kur2'?'kur1':'deg1','İki PIN aynı değil, baştan gir.',true);return}
      $('pinAlt').textContent='Kaydediliyor…';
      tuz=crypto.getRandomValues(new Uint8Array(16));
      anahtar=await anahtarUret(p,tuz);
      if(mod==='kur2') veri={kartlar:tohum||[]};
      await kaydet();
      tohum=null; ilkPin=''; anaGoster();
    }else if(mod==='ac'){
      const d=denemeOku(), kalan=d.t-Date.now();
      if(kalan>0){pinGoster('ac',Math.ceil(kalan/1000)+' saniye sonra tekrar dene.',true);return}
      $('pinAlt').textContent='Açılıyor…'; $('pinAlt').classList.remove('hata');
      try{
        await ac(p); kaldir(DENEME); anaGoster();
      }catch(e){
        d.n++; if(d.n>=5) d.t=Date.now()+30000*Math.pow(2,Math.min(d.n-5,6));
        try{yaz(DENEME,JSON.stringify(d))}catch(_){}
        pinGoster('ac',d.n>=5?'Çok fazla yanlış deneme, biraz bekle.':'PIN yanlış, tekrar dene.',true);
      }
    }
  }catch(e){
    if(m==='kur2'){anahtar=null;tuz=null}
    pinGoster(m==='deg2'?'deg1':'kur1','Kayıt yapılamadı. Tarayıcının site verisi izni kapalı olabilir.',true);
  }finally{mesgul=false}
}
document.addEventListener('keydown',e=>{
  if($('pinEkran').hidden) return;
  if(/^[0-9]$/.test(e.key)) pinEkle(e.key);
  else if(e.key==='Backspace') pinSil();
});

/* Ana ekran */
function anaGoster(){
  $('pinEkran').hidden=true; $('anaEkran').hidden=false; ciz(); bostaKur();
}
function etiketYaz(ad){
  const p=ad.trim().split(/\s+/).filter(Boolean);
  return (p.length>1?p[0][0]+p[1][0]:(p[0]||'?').slice(0,2)).toLocaleUpperCase('tr');
}
function ciz(){
  const l=$('liste'); l.textContent='';
  veri.kartlar.forEach(k=>{
    const eksik=!k.kullanici||!k.sifre;
    const s=document.createElement('div'); s.className='satir'+(eksik?' eksik':'');
    const a=document.createElement('button'); a.type='button'; a.className='ac';
    const e=document.createElement('span'); e.className='etiket'; e.textContent=etiketYaz(k.ad);
    const b=document.createElement('span'); b.className='bilgi';
    const ad=document.createElement('span'); ad.className='ad'; ad.textContent=k.ad;
    const al=document.createElement('span'); al.className='alan'; al.textContent=eksik?'Giriş bilgilerini gir':alanAdi(k.adres);
    b.append(ad,al); a.append(e,b);
    a.onclick=()=>eksik?pencereAc(k):panelAc(k);
    const d=document.createElement('button'); d.type='button'; d.className='duzenle'; d.textContent='Düzenle'; d.onclick=()=>pencereAc(k);
    s.append(a,d); l.appendChild(s);
  });
  $('bosMesaj').hidden=veri.kartlar.length>0;
}
function panelAc(k){
  const f=document.createElement('form');
  f.method='post'; f.action=k.adres+'/index.php?route=common/login'; f.target='_blank'; f.rel='noopener'; f.hidden=true; f.autocomplete='off';
  [['username',k.kullanici],['password',k.sifre],['redirect',k.adres+'/index.php?route=sale/order']].forEach(([n,v])=>{
    const i=document.createElement('input'); i.type='hidden'; i.name=n; i.value=v; f.appendChild(i);
  });
  document.body.appendChild(f); f.submit(); f.remove();
  bildir(k.ad+' açılıyor');
  bostaKur();
}
let bildirimSayac;
function bildir(m){const b=$('bildirim');b.textContent=m;b.hidden=false;clearTimeout(bildirimSayac);bildirimSayac=setTimeout(()=>b.hidden=true,2200)}
function kilitle(){anahtar=null;tuz=null;veri={kartlar:[]};clearTimeout(bostaSayac);if($('pencere').open)$('pencere').close();pinGoster('ac')}
let sonAktif=0;
function bostaKur(){sonAktif=Date.now();clearTimeout(bostaSayac);bostaSayac=setTimeout(kilitle,BOSTA_MS)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&anahtar&&Date.now()-sonAktif>=BOSTA_MS)kilitle()});
['click','keydown','touchstart'].forEach(o=>document.addEventListener(o,()=>{if(anahtar)bostaKur()},{passive:true}));
function ikiAdim(btn,ilk,ikinci,islem){
  btn.onclick=()=>{
    if(btn.classList.contains('emin')){islem();return}
    btn.classList.add('emin'); btn.textContent=ikinci;
    setTimeout(()=>{btn.classList.remove('emin');btn.textContent=ilk},5000);
  };
}

/* Düzenleme penceresi */
function pencereAc(k){
  duzenlenen=k||null;
  $('pencereBaslik').textContent=k?k.ad:'Site ekle';
  $('fAd').value=k?k.ad:''; $('fAdres').value=k?k.adres.replace(/^https:\/\//,''):'';
  $('fKullanici').value=k?k.kullanici:''; $('fSifre').value=k?k.sifre:'';
  $('fSifre').type='password'; $('goster').textContent='Göster';
  $('hata').hidden=true; $('sil').hidden=!k; $('sil').classList.remove('emin'); $('sil').textContent='Siteyi sil';
  $('pencere').showModal();
}
$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  let adres;
  try{adres=adresDuzelt($('fAdres').value)}catch(_){
    $('hata').textContent='Panel adresi geçersiz. Örnek: siteadi.com/admin (https gerekli).'; $('hata').hidden=false; return;
  }
  const yeni={ad:$('fAd').value.trim(),adres,kullanici:$('fKullanici').value.trim(),sifre:$('fSifre').value};
  const eskisi=duzenlenen?{...duzenlenen}:null;
  if(duzenlenen) Object.assign(duzenlenen,yeni);
  else veri.kartlar.push({id:yeniId(),...yeni});
  try{await kaydet();$('pencere').close();ciz();bildir('Kaydedildi')}
  catch(_){
    if(eskisi) Object.assign(duzenlenen,eskisi); else veri.kartlar.pop();
    $('hata').textContent='Kaydedilemedi. Tarayıcının site verisi izni kapalı olabilir.'; $('hata').hidden=false;
  }
});
$('vazgec').onclick=()=>$('pencere').close();
$('goster').onclick=()=>{const g=$('fSifre').type==='password';$('fSifre').type=g?'text':'password';$('goster').textContent=g?'Gizle':'Göster'};
ikiAdim($('sil'),'Siteyi sil','Silmek için tekrar bas',async()=>{
  veri.kartlar=veri.kartlar.filter(x=>x!==duzenlenen);
  await kaydet();$('pencere').close();ciz();bildir('Site silindi');
});

$('ekle').onclick=()=>pencereAc(null);
$('kilitle').onclick=kilitle;
$('pinVazgec').onclick=()=>{ilkPin='';anaGoster()};
$('pinDegis').onclick=()=>pinGoster('deg1','Şifreler yeni PIN ile yeniden şifrelenir.');
function hepsiniSil(){kaldir(KASA);kaldir(DENEME);anahtar=null;tuz=null;veri={kartlar:[]};clearTimeout(bostaSayac);pinGoster('kur1','Kayıtlar silindi. 6 haneli yeni PIN seç.')}
ikiAdim($('hepsiniSil'),'Bu cihazdaki kayıtları sil','Her şey silinecek, emin misin? Tekrar bas',hepsiniSil);
ikiAdim($('unuttum'),'PIN\'i unuttum','Kayıtlar silinecek, tekrar bas',hepsiniSil);

/* Başlangıç */
tusKur(); tohumOku();
if(!window.crypto||!crypto.subtle){
  pinGoster('ac','Bu tarayıcı şifrelemeyi desteklemiyor. Sayfayı https adresinden aç.',true);
  $('tus').hidden=true; $('unuttum').hidden=true;
}else if(oku(KASA)){pinGoster('ac')}
else{pinGoster('kur1','Bu cihazda açılış için 6 haneli PIN.')}
</script>
</body>
</html>
